set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -g focus-events on

# window selecting
bind-key C-o last-window

# set window split
unbind-key h
bind-key h split-window -h
bind-key v split-window

# close window
bind-key 0 kill-pane

# default window title colors
set-option -g status-style bg=colour15,fg=colour1
set-window-option -g window-status-style fg=colour244,bg=default #base0
#set-window-option -g window-status-attr dim

# active window title colors
set-window-option -g window-status-current-style fg=red,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour40 #base01

# message text
set-option -g message-style bg=colour235,fg=colour166 #base02, orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour green #green

set -g status-interval 1
set -g status-justify left # center align window list
set -g status-left-length 20
set -g status-right-length 80
set -g status-left '#[fg=green]#H #[fg=black]• #[default]  '
set -g status-right '#[default]#[fg=colour166,bg=default]#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",")#[default]  #[fg=black,bg=default]%a%l:%M:%S %p#[default] #[fg=white]%Y-%m-%d'

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 40\; select-layout main-horizontal

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# auto window rename
set-window-option -g automatic-rename

# color
set -g default-terminal "screen-256color"
